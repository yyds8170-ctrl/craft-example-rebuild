<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Example Domain</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="column">
    <!-- 书本图标：对应取证 outline 中的 44x44 svg，打开的书+右页引号 -->
    <svg class="book-icon" width="44" height="44" viewBox="0 0 24 24" fill="none"
         stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true">
      <!-- 左页 -->
      <path d="M12 6.2C10.2 5.2 7.8 5 5 5.4V19c2.8-.4 5.2-.2 7 .8z"/>
      <!-- 右页 -->
      <path d="M12 6.2c1.8-1 4.2-1.2 7-.8V19c-2.8-.4-5.2-.2-7 .8z"/>
      <!-- 右页引号 -->
      <path d="M15.2 10.2c-.9 0-1.4.6-1.4 1.4 0 .7.5 1.2 1.1 1.2.7 0 1.1-.5 1.1-1.2 0-.1 0-.2-.1-.3.6.1 1 .6 1 1.3M18 10.2c-.9 0-1.4.6-1.4 1.4 0 .7.5 1.2 1.1 1.2.7 0 1.1-.5 1.1-1.2 0-.1 0-.2-.1-.3.6.1 1 .6 1 1.3"
            stroke-width="1.2"/>
    </svg>

    <!-- 主段落：16px，宽 416 -->
    <p class="lead">
      This domain is for use in documentation examples without needing permission.
      This is not a service; avoid relying on it for testing and monitoring purposes.
    </p>

    <!-- 辅助段落：14px -->
    <p class="note">
      该域名仅用于文档示例，无需获得许可。这并非一项服务，请勿将其用于测试和监控目的。
    </p>

    <!-- 链接：颜色 #000ee -->
    <a class="more" href="https://www.iana.org/help/example-domains">Learn more</a>
  </main>
</body>
</html>
